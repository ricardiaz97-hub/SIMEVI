<head>

<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SIMEVI Seguros</title>
<meta name="description" content="Trámites, reclamos, pólizas y pagos de SIMEVI Corredores de Seguros.">

<script>
/* Modo ligero: teléfonos con poca memoria, ahorro de datos, ?lite o el interruptor de Ajustes */
(function(){try{
  var q=location.search.indexOf('lite')>-1, s=localStorage.getItem('simevi-lite');
  var auto=(navigator.deviceMemory&&navigator.deviceMemory<=3)||(navigator.connection&&navigator.connection.saveData);
  if(q||s==='1'||(s!=='0'&&auto))document.documentElement.classList.add('lite');
}catch(e){}})();
</script>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="sky" aria-hidden="true"><div class="stars"></div><div class="ring"></div><div class="grain"></div></div>
<!--ICONS-->
<div id="root"></div>
<div class="toasts" id="toasts" role="status" aria-live="polite"></div>
<script src="app.js"></script>
</body>
</html>
